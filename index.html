<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="stylesheet" href="css/app.css">

<body>

<div id="app"></div>

<!-- 底部标签栏 -->
<nav class="tabbar hide" id="tabbar">
  <a href="#/home"     data-tab="home"><span class="ic">🏠</span>首页</a>
  <a href="#/chapters" data-tab="chapters"><span class="ic">📖</span>章节</a>

<!-- 首次启动的发音解锁。必须在真实点击里同步触发 -->
<div class="veil" id="unlockVeil" hidden>
  <div class="inner">
    <div style="font-size:44px;margin-bottom:6px">🔊</div>
    <h2>先开启发音</h2>
    <p>Safari 规定：网页必须先收到一次真实点击，才允许朗读。点下面这个按钮就行。</p>
    <button class="btn" id="unlockBtn">开启发音</button>
    <button class="btn ghost" id="unlockSkip" style="margin-top:10px">先不用发音，直接开始</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
